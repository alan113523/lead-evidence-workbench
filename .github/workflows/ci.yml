name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install optional collection transport
        run: npm install --prefix .deps --no-save --no-package-lock --ignore-scripts playwright-core@1.60.0
      - name: Verify pinned transport
        run: node -e "if(require('./.deps/node_modules/playwright-core/package.json').version!=='1.60.0')process.exit(1)"
      - run: npm run check:privacy
      - run: npm test
      - run: npm run demo -- ci-demo
      - run: npm run demo:collect -- ci-collector-demo
      - run: npm run collect -- --help
      - run: python -X utf8 formal-review/examples/synthetic_demo.py --out data/ci-formal --customers 3 --matched 0
      - name: Scan published Git history
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          temp_dir="$(mktemp -d)"
          curl -fsSL "$base/gitleaks_${version}_linux_x64.tar.gz" -o "$temp_dir/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL "$base/gitleaks_${version}_checksums.txt" -o "$temp_dir/checksums.txt"
          (cd "$temp_dir" && grep " gitleaks_${version}_linux_x64.tar.gz$" checksums.txt | sha256sum -c -)
          tar -xzf "$temp_dir/gitleaks_${version}_linux_x64.tar.gz" -C "$temp_dir" gitleaks
          "$temp_dir/gitleaks" git . --redact=100 --no-banner
